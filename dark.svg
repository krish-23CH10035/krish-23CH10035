<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="Krish Sahu software engineer AI systems profile banner">
  <defs>
    <linearGradient id="bgGradDark" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#040b16"/>
      <stop offset="35%" stop-color="#081827"/>
      <stop offset="100%" stop-color="#060d19"/>
    </linearGradient>

    <linearGradient id="panelGradDark" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1627" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a1320" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="accentGradDark" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <radialGradient id="glowDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="45%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <pattern id="gridDark" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#93c5fd" stroke-opacity="0.06" stroke-width="0.6"/>
    </pattern>

    <filter id="softGlowDark">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="panelShadowDark">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <mask id="maskTextRevealDark">
      <rect width="100%" height="100%" fill="black"/>
      <rect x="0" y="0" width="0" height="100%">
        <animate attributeName="width" values="0;100%;0" dur="6s" repeatCount="indefinite" />
      </rect>
    </mask>
  </defs>

